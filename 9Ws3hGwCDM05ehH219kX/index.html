        document.addEventListener("DOMContentLoaded", function() {
            if (globalPayload.updated_at) {
                document.getElementById('time-tag').innerText = '時間: ' + globalPayload.updated_at.split(' ')[1];
                switchCategory('1_ACTIVE_ETF', document.querySelectorAll('.nav-chip')[0]);
            }
        });

        function switchCategory(catKey, btn) {
            document.querySelectorAll('.nav-chip').forEach(el => el.classList.remove('active'));
            if (btn) btn.classList.add('active');

            const marketData = globalPayload.market_data || [];
            const filtered = marketData.filter(item => item.asset_type === catKey);

            let rows = '';
            filtered.forEach(item => {
                let isUp = item.pct > 0;
                let isDown = item.pct < 0;
                let colorClass = isUp ? 'text-danger fw-bold' : (isDown ? 'text-success fw-bold' : 'text-secondary');
                let arrow = isUp ? '▲' : (isDown ? '▼' : '');

                rows += `
                <tr>
                    <td>
                        <div class="fw-bold font-monospace text-primary">${item.code}</div>
                        <div class="small text-secondary">${item.name}</div>
                    </td>
                    <td class="text-end font-monospace fs-6 fw-bold">$${item.price.toLocaleString()}</td>
                    <td class="text-end font-monospace ${colorClass}">${arrow}${Math.abs(item.pct).toFixed(2)}%</td>
                    <td class="text-center"><span class="badge bg-light text-dark border">${item.unit}</span></td>
                </tr>`;
            });

            document.getElementById('asset-tbody').innerHTML = rows || '<tr><td colspan="4" class="text-center text-secondary py-3">目前類別無資料</td></tr>';
